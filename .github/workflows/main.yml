name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after CI succeeds"
        required: false
        type: boolean
        default: false

      run_e2e:
        description: "Run end-to-end tests"
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  NODE_OPTIONS: --max-old-space-size=4096
  NODE_VERSION: "22.x"
  MIN_COVERAGE: "80"

jobs:
  validate:
    name: Validate and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run lint checks
        run: npm run lint

      - name: Run type checks
        run: npm run typecheck
        continue-on-error: false

      - name: Check formatting
        run: npm run format:check
        continue-on-error: false

      - name: Audit critical dependencies
        run: npm audit --audit-level=critical

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run unit tests with coverage
        run: npm run test:unit -- --coverage
        env:
          VITE_API_KEY: ci-public-test-key

      - name: Validate coverage threshold
        shell: bash
        run: |
          set -euo pipefail

          SUMMARY_FILE="coverage/coverage-summary.json"

          if [[ ! -f "$SUMMARY_FILE" ]]; then
            echo "::error::Coverage summary not found at $SUMMARY_FILE"
            exit 1
          fi

          COVERAGE="$(node -p "require('./${SUMMARY_FILE}').total.lines.pct")"

          echo "Line coverage: ${COVERAGE}%"
          echo "Required coverage: ${MIN_COVERAGE}%"

          awk -v coverage="$COVERAGE" -v minimum="$MIN_COVERAGE" \
            'BEGIN { exit !(coverage >= minimum) }' \
            || {
              echo "::error::Coverage is below the required threshold."
              exit 1
            }

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [validate, unit-tests]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_KEY: ci-public-test-key

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -f dist/index.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    permissions:
      contents: read
      checks: write

    # E2E runs by default for push/PR, or when selected during manual dispatch.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_e2e }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: application-dist
          path: dist/

      - name: Install Playwright browser and dependencies
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          # Use this only for a public/client-safe key.
          VITE_API_KEY: ${{ vars.VITE_API_KEY }}

          # Use a non-VITE-prefixed secret for privileged test credentials.
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}

          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  deploy-development:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [validate, unit-tests, build, e2e-tests]
    timeout-minutes: 20

    # Automatically deploy pushes to develop.
    # A manual deploy requires workflow_dispatch + deploy=true.
    if: >-
      github.ref == 'refs/heads/develop' &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy))

    environment:
      name: development
      url: ${{ vars.DEVELOPMENT_APP_URL }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download production build artifact
        uses: actions/download-artifact@v4
        with:
          name: application-dist
          path: dist/

      - name: Deploy to development
        run: |
          echo "Deploying commit $GITHUB_SHA to development"
          # Replace with the deployment command for your platform.
          # Example: npm run deploy:development
        env:
          DEPLOY_TOKEN: ${{ secrets.DEVELOPMENT_DEPLOY_TOKEN }}
          DEPLOY_URL: ${{ vars.DEVELOPMENT_DEPLOY_URL }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate, unit-tests, build, e2e-tests]
    timeout-minutes: 30

    # Deploy main only after a direct push/merge, or manually with deploy=true.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy))

    environment:
      name: production
      url: ${{ vars.PRODUCTION_APP_URL }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download production build artifact
        uses: actions/download-artifact@v4
        with:
          name: application-dist
          path: dist/

      - name: Deploy to production
        run: |
          echo "Deploying commit $GITHUB_SHA to production"
          # Replace with the deployment command for your platform.
          # Example: npm run deploy:production
        env:
          DEPLOY_TOKEN: ${{ secrets.PRODUCTION_DEPLOY_TOKEN }}
          DEPLOY_URL: ${{ vars.PRODUCTION_DEPLOY_URL }}

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      - validate
      - unit-tests
      - build
      - e2e-tests
    if: always()

    steps:
      - name: Verify required CI jobs passed
        shell: bash
        run: |
          set -euo pipefail

          declare -A results=(
            [validate]="${{ needs.validate.result }}"
            [unit-tests]="${{ needs.unit-tests.result }}"
            [build]="${{ needs.build.result }}"
            [e2e-tests]="${{ needs.e2e-tests.result }}"
          )

          for job in "${!results[@]}"; do
            echo "$job: ${results[$job]}"

            if [[ "${results[$job]}" != "success" && "${results[$job]}" != "skipped" ]]; then
              echo "::error::Required CI job failed: $job"
              exit 1
            fi
          done

          echo "CI pipeline completed successfully."
