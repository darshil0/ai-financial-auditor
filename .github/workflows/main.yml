name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run E2E tests when E2E_API_KEY is available"
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  NODE_OPTIONS: --max-old-space-size=4096
  NODE_VERSION: "24.x"
  MIN_COVERAGE: "80"

jobs:
  validate:
    name: Validate and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run lint checks
        run: npm run lint

      - name: Run critical dependency audit
        run: npm audit --audit-level=critical

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run unit tests with coverage
        run: npm run test:unit -- --coverage
        env:
          VITE_API_KEY: ci-public-test-key

      - name: Validate coverage threshold
        shell: bash
        run: |
          set -euo pipefail

          SUMMARY_FILE="coverage/coverage-summary.json"

          if [[ ! -f "$SUMMARY_FILE" ]]; then
            echo "::warning::Coverage summary not found. Skipping coverage threshold validation."
            exit 0
          fi

          COVERAGE="$(node -p "require('./${SUMMARY_FILE}').total.lines.pct")"

          echo "Line coverage: ${COVERAGE}%"
          echo "Required coverage: ${MIN_COVERAGE}%"

          awk -v coverage="$COVERAGE" -v minimum="$MIN_COVERAGE" \
            'BEGIN { exit !(coverage >= minimum) }' \
            || {
              echo "::error::Coverage ${COVERAGE}% is below ${MIN_COVERAGE}%."
              exit 1
            }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_KEY: ci-public-test-key

      - name: Verify build artifacts
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "dist" ]]; then
            echo "::error::Build failed: dist directory was not created."
            exit 1
          fi

          if [[ ! -f "dist/index.html" ]]; then
            echo "::error::Build failed: dist/index.html was not created."
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: application-dist
          path: dist/

      - name: Check E2E configuration
        id: e2e-config
        shell: bash
        env:
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
          RUN_E2E: ${{ github.event_name == 'workflow_dispatch' && inputs.run_e2e || true }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$RUN_E2E" != "true" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [[ -z "$E2E_API_KEY" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::E2E_API_KEY is not configured. E2E tests will be skipped."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright browser
        if: steps.e2e-config.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        if: steps.e2e-config.outputs.run == 'true'
        run: npm run test:e2e
        env:
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
          CI: "true"

      - name: Upload E2E test results
        if: always() && steps.e2e-config.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      - validate
      - unit-tests
      - build
      - e2e-tests
    if: always()
    timeout-minutes: 5

    steps:
      - name: Verify CI result
        shell: bash
        run: |
          set -euo pipefail

          echo "validate: ${{ needs.validate.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "e2e-tests: ${{ needs.e2e-tests.result }}"

          [[ "${{ needs.validate.result }}" == "success" ]] || exit 1
          [[ "${{ needs.unit-tests.result }}" == "success" ]] || exit 1
          [[ "${{ needs.build.result }}" == "success" ]] || exit 1
          
          # Allow e2e-tests to be skipped/neutral without failing the pipeline status check
          if [[ "${{ needs.e2e-tests.result }}" != "success" && "${{ needs.e2e-tests.result }}" != "skipped" ]]; then
            exit 1
          fi

          echo "CI/CD Pipeline Passed"
