name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  validate-and-lint:
    name: Validate & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (Stable)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Check for Secrets in Code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Run Security Audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Lint Code (TypeScript + Prettier)
        run: npm run lint

      - name: TypeScript Type Check
        run: npx tsc --noEmit

  unit-tests:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: validate-and-lint
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "22.x"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run Unit Tests with Coverage
        run: npm run test:unit -- --coverage
        env:
          VITE_API_KEY: test_key_for_ci_do_not_use

      - name: Validate Coverage Targets
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          MIN_COVERAGE=80
          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below target $MIN_COVERAGE%"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% meets target $MIN_COVERAGE%"

  build:
    name: Build Verification (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: validate-and-lint
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "22.x"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build Application
        run: npm run build
        env:
          VITE_API_KEY: dummy_key_for_build
          NODE_ENV: production

      - name: Verify Build Artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist/ directory not created"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Build failed: dist/index.html not found"
            exit 1
          fi
          echo "✅ Build artifacts verified"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist-node-${{ matrix.node-version }}
          path: dist/
          retention-days: 7
          if-no-files-found: warn

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [validate-and-lint, build]
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Stable)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-node-24
          path: dist/

      - name: Verify Build Artifacts Exist
        run: |
          if [ ! -d "dist" ] || [ ! -f "dist/index.html" ]; then
            echo "❌ Build artifacts not found. E2E tests cannot proceed."
            exit 1
          fi
          echo "✅ Build artifacts ready for E2E testing"

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Check for API Key
        id: api-key-check
        run: |
          if [ -z "${{ secrets.VITE_API_KEY }}" ]; then
            echo "warn=true" >> $GITHUB_OUTPUT
            echo "⚠️ Warning: VITE_API_KEY not set. E2E tests will be skipped."
          else
            echo "warn=false" >> $GITHUB_OUTPUT
            echo "✅ API key available. E2E tests will run."
          fi

      - name: Run E2E Tests
        if: steps.api-key-check.outputs.warn == 'false'
        run: npm run test:e2e
        env:
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: junit.xml

      - name: Skip E2E Tests
        if: steps.api-key-check.outputs.warn == 'true'
        run: echo "⚠️ Skipping E2E tests: VITE_API_KEY not configured in GitHub Secrets"

      - name: Upload E2E Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish E2E Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: E2E Test Results
          path: "test-results/junit.xml"
          reporter: "java-junit"
          fail-on-error: false

  ci-status:
    name: CI/CD Status
    runs-on: ubuntu-latest
    needs: [validate-and-lint, unit-tests, build, e2e-tests]
    if: always()
    steps:
      - name: Determine CI Status
        run: |
          if [[ \
            "${{ needs.validate-and-lint.result }}" == "success" && \
            "${{ needs.unit-tests.result }}" == "success" && \
            "${{ needs.build.result }}" == "success" \
          ]]; then
            echo "✅ CI/CD Pipeline Passed"
          else
            echo "❌ CI/CD Pipeline Failed"
            exit 1
          fi
