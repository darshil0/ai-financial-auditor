name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      allow_skip_e2e:
        description: Allow E2E tests to skip when E2E_API_KEY is unavailable
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: "true"
  NODE_OPTIONS: --max-old-space-size=4096
  MIN_COVERAGE: "80"

jobs:
  validate-and-lint:
    name: Validate & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Check for leaked secrets
        uses: trufflesecurity/trufflehog@34339eaf08bf5c2a27dbd969812127721f3743ed # v3.88.22
        with:
          path: ./
          base: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.pull_request.base.sha ||
                github.event.before ||
                github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        timeout-minutes: 5

      - name: Run blocking security audit
        run: npm audit --audit-level=critical

      - name: Run advisory security audit
        id: security-audit-moderate
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Report moderate security findings
        if: steps.security-audit-moderate.outcome == 'failure'
        run: |
          echo "::warning::npm audit found moderate-or-higher dependency vulnerabilities. Review before merging."

      - name: Run lint checks
        run: npm run lint

  unit-tests:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: validate-and-lint
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.x", "24.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run unit tests with coverage
        run: npm run test:unit -- --coverage
        env:
          VITE_API_KEY: ci-public-test-key

      - name: Validate coverage threshold
        shell: bash
        run: |
          set -euo pipefail

          SUMMARY="coverage/coverage-summary.json"

          if [[ ! -f "$SUMMARY" ]]; then
            echo "::error::${SUMMARY} was not generated. Configure the test runner to emit a JSON summary reporter."
            exit 1
          fi

          COVERAGE="$(node -p "require('./${SUMMARY}').total.lines.pct")"

          if [[ -z "$COVERAGE" || "$COVERAGE" == "undefined" || "$COVERAGE" == "null" ]]; then
            echo "::error::Could not read line coverage from ${SUMMARY}."
            exit 1
          fi

          echo "Line coverage: ${COVERAGE}% (minimum: ${MIN_COVERAGE}%)"

          awk -v coverage="$COVERAGE" -v minimum="$MIN_COVERAGE" \
            'BEGIN { exit !(coverage >= minimum) }' \
            || {
              echo "::error::Coverage ${COVERAGE}% is below the required ${MIN_COVERAGE}%."
              exit 1
            }

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: vitest-coverage-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build Verification (Node 24)
    runs-on: ubuntu-latest
    needs: validate-and-lint
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 24
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_KEY: ci-public-test-key

      - name: Verify build artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -f dist/index.html

      - name: Upload build artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: dist-node-24
          path: dist/
          retention-days: 7
          if-no-files-found: error

  build-compat:
    name: Build Compatibility (Node 22)
    runs-on: ubuntu-latest
    needs: validate-and-lint
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_KEY: ci-public-test-key

      - name: Verify build artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -f dist/index.html

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [validate-and-lint, build]
    timeout-minutes: 30

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 24
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Download build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372ec801d16 # v4.1.8
        with:
          name: dist-node-24
          path: dist

      - name: Verify build artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -f dist/index.html

      - name: Cache Playwright browsers
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Determine E2E policy
        id: e2e-policy
        shell: bash
        env:
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
          ALLOW_SKIP: ${{ inputs.allow_skip_e2e }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail

          if [[ -n "$E2E_API_KEY" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [[ "$ALLOW_SKIP" == "true" || "$IS_FORK_PR" == "true" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail when E2E credentials are required but unavailable
        if: steps.e2e-policy.outputs.run != 'true' && steps.e2e-policy.outputs.skip != 'true'
        run: |
          echo "::error::E2E_API_KEY is unavailable. Configure the secret or manually dispatch the workflow with allow_skip_e2e=true."
          exit 1

      - name: Run E2E tests
        if: steps.e2e-policy.outputs.run == 'true'
        run: npm run test:e2e
        env:
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}

      - name: Report intentional E2E skip
        if: steps.e2e-policy.outputs.skip == 'true'
        run: |
          echo "::warning::E2E tests skipped because credentials are unavailable and skipping is permitted for this run."

      - name: Upload E2E artifacts
        if: always() && steps.e2e-policy.outputs.run == 'true'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish E2E report
        if: >-
          always() &&
          steps.e2e-policy.outputs.run == 'true' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: dorny/test-reporter@6c357194179c694acfcad2100dbf27c5b9b0d5e0 # v1.9.1
        with:
          name: E2E Test Results
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

  ci-status:
    name: CI/CD Status
    runs-on: ubuntu-latest
    needs: [validate-and-lint, unit-tests, build, build-compat, e2e-tests]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Determine CI status
        shell: bash
        run: |
          set -euo pipefail

          results=(
            "validate-and-lint=${{ needs.validate-and-lint.result }}"
            "unit-tests=${{ needs.unit-tests.result }}"
            "build=${{ needs.build.result }}"
            "build-compat=${{ needs.build-compat.result }}"
            "e2e-tests=${{ needs.e2e-tests.result }}"
          )

          printf '%s\n' "${results[@]}"

          for result in "${results[@]}"; do
            if [[ "$result" != *=success ]]; then
              echo "::error::CI/CD Pipeline Failed"
              exit 1
            fi
          done

          echo "CI/CD Pipeline Passed"
