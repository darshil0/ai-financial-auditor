name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      allow_skip_e2e:
        description: "Allow E2E job to skip (instead of fail) if VITE_API_KEY secret is missing"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096
  MIN_COVERAGE: 80

jobs:
  validate-and-lint:
    name: Validate & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (Stable)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci --no-audit

      - name: Check for Secrets in Code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        timeout-minutes: 5

      - name: Run Security Audit
        id: security-audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Flag Security Audit Findings
        if: steps.security-audit.outcome == 'failure'
        run: echo "::warning::npm audit reported moderate+ vulnerabilities. Review before merging; this step is non-blocking by design."

      - name: Lint Code (TypeScript + Prettier)
        run: npm run lint

      - name: TypeScript Type Check
        run: npx tsc --noEmit

  unit-tests:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: validate-and-lint
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "22.x"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci --no-audit

      - name: Run Unit Tests with Coverage
        run: npm run test:unit -- --coverage
        env:
          VITE_API_KEY: test_key_for_ci_do_not_use

      - name: Validate Coverage Targets
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "❌ coverage/coverage-summary.json not found — test:unit did not emit a summary reporter."
            exit 1
          fi
          COVERAGE=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
          echo "Line coverage: ${COVERAGE}% (target: ${MIN_COVERAGE}%)"
          awk -v cov="$COVERAGE" -v min="$MIN_COVERAGE" 'BEGIN { exit !(cov >= min) }' \
            && echo "✅ Coverage meets target" \
            || { echo "❌ Coverage ${COVERAGE}% is below target ${MIN_COVERAGE}%"; exit 1; }

  build:
    name: Build Verification (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: validate-and-lint
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24", "22.x"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci --no-audit

      - name: Build Application
        run: npm run build
        env:
          VITE_API_KEY: dummy_key_for_build
          NODE_ENV: production

      - name: Verify Build Artifacts
        run: |
          test -d dist || { echo "❌ Build failed: dist/ directory not created"; exit 1; }
          test -f dist/index.html || { echo "❌ Build failed: dist/index.html not found"; exit 1; }
          echo "✅ Build artifacts verified"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-node-${{ matrix.node-version }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [validate-and-lint, build]
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Stable)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci --no-audit

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-node-24
          path: dist/

      - name: Verify Build Artifacts Exist
        run: |
          if [ ! -d "dist" ] || [ ! -f "dist/index.html" ]; then
            echo "❌ Build artifacts not found. E2E tests cannot proceed."
            exit 1
          fi
          echo "✅ Build artifacts ready for E2E testing"

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS Dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Check for API Key
        id: api-key-check
        run: |
          if [ -z "${{ secrets.VITE_API_KEY }}" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce API Key Presence
        if: steps.api-key-check.outputs.missing == 'true' && github.event.inputs.allow_skip_e2e != true
        run: |
          echo "::error::VITE_API_KEY is not configured in GitHub Secrets. Failing instead of silently skipping E2E coverage. Re-run via workflow_dispatch with allow_skip_e2e=true to intentionally skip."
          exit 1

      - name: Run E2E Tests
        if: steps.api-key-check.outputs.missing == 'false'
        run: npm run test:e2e
        env:
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: junit.xml

      - name: Skip E2E Tests (explicit opt-in only)
        if: steps.api-key-check.outputs.missing == 'true' && github.event.inputs.allow_skip_e2e == true
        run: echo "::warning::Skipping E2E tests — VITE_API_KEY not configured and allow_skip_e2e was explicitly set."

      - name: Upload E2E Test Results
        if: always() && steps.api-key-check.outputs.missing == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish E2E Test Report
        if: always() && steps.api-key-check.outputs.missing == 'false'
        uses: dorny/test-reporter@v1
        with:
          name: E2E Test Results
          path: "test-results/junit.xml"
          reporter: "java-junit"
          fail-on-error: false

  ci-status:
    name: CI/CD Status
    runs-on: ubuntu-latest
    needs: [validate-and-lint, unit-tests, build, e2e-tests]
    if: always()
    steps:
      - name: Determine CI Status
        run: |
          if [[ \
            "${{ needs.validate-and-lint.result }}" == "success" && \
            "${{ needs.unit-tests.result }}" == "success" && \
            "${{ needs.build.result }}" == "success" && \
            "${{ needs.e2e-tests.result }}" == "success" \
           ]]; then
            echo "✅ CI/CD Pipeline Passed"
          else
            echo "❌ CI/CD Pipeline Failed"
            echo "validate-and-lint: ${{ needs.validate-and-lint.result }}"
            echo "unit-tests: ${{ needs.unit-tests.result }}"
            echo "build: ${{ needs.build.result }}"
            echo "e2e-tests: ${{ needs.e2e-tests.result }}"
            exit 1
          fi
